<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#496ca3" />
    <meta
      name="description"
      content="Pioneiros no desenvolvimento de um sistema CRM sob medida para indústrias. Mais de 15 anos transformando operações de vendas."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:wght@100;300;400;500;700;900&display=swap"
    />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: "Inter", "Roboto", sans-serif;
        overflow-x: hidden;
      }

      /* Scroll suave */
      html {
        scroll-behavior: smooth;
      }

      /* Scrollbar personalizada */
      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }

      ::-webkit-scrollbar-thumb {
        background: #496ca3;
        border-radius: 5px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #2e4a75;
      }
    </style>
    <title>INFOTEC - CRM e Consultoria para Indústrias</title>
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para rodar esta aplicação.</noscript>
    <div id="root"></div>
  </body>
</html>
